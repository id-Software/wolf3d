name: RetroRaycaster CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore RetroRaycaster.sln
      - name: Build
        run: dotnet build RetroRaycaster.sln -c Release --no-restore
      - name: Test
        run: dotnet test RetroRaycaster.sln -c Release --no-build
